name: Ringbook iOS IPA

on:
  push:
    paths: ['dialer/**', 'mobile/**', '.github/workflows/ringbook-ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run sync
      # Unsigned build: Sideloadly / AltStore re-sign it with your Apple ID when installing.
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Ringbook.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Ringbook-ipa
          path: mobile/Ringbook.ipa
